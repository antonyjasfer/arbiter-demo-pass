<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskBoard</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; color: #1f2328; }
      form { display: flex; gap: 0.5rem; align-items: end; }
      label.field { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; font-size: 0.9rem; }
      input[type="text"] { padding: 0.45rem; font-size: 1rem; }
      button { padding: 0.5rem 1rem; font-size: 1rem; }
      ul { list-style: none; padding: 0; }
      li { padding: 0.4rem 0; border-bottom: 1px solid #eee; }
      .done { text-decoration: line-through; color: #777; }
    </style>
  </head>
  <body>
    <h1>TaskBoard</h1>
    <form id="add-form">
      <label class="field">New task <input id="new-task" type="text" autocomplete="off" /></label>
      <button type="submit">Add</button>
    </form>
    <p id="empty">No tasks yet.</p>
    <ul id="tasks" aria-label="Tasks"></ul>
    <script src="/tasks.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
